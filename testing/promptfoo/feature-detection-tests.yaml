- description: "2 features: webhook retries and request signing"
  vars:
    expected_features: >-
      [{"id":"webhook-retries","name":"Automatic webhook retries","description":"Failed webhook deliveries are retried with exponential delays up to five attempts."},{"id":"webhook-signatures","name":"Signed webhook deliveries","description":"Webhook requests include an HMAC SHA-256 signature so receivers can verify that payloads are authentic."}]
    customers: >-
      [{"customer_id":"cus_RAIeval041","cancellation_reason":"We lost events whenever our endpoint was briefly unavailable because failed webhooks were never retried."},{"customer_id":"cus_RAIeval042","cancellation_reason":"I canceled because webhook delivery had no automatic retry after a server error."},{"customer_id":"cus_RAIeval043","cancellation_reason":"Our integration needed several retry attempts with increasing delays."},{"customer_id":"cus_RAIeval044","cancellation_reason":"A momentary outage caused permanent data gaps. Retrying failed webhook calls was essential."},{"customer_id":"cus_RAIeval045","cancellation_reason":"The product gave up after one failed webhook request and that made it unreliable for us."},{"customer_id":"cus_RAIeval046","cancellation_reason":"Security would not approve unsigned webhooks. We needed an HMAC signature on every request."},{"customer_id":"cus_RAIeval047","cancellation_reason":"I could not verify that webhook payloads really came from your service."},{"customer_id":"cus_RAIeval048","cancellation_reason":"Our receiver requires SHA-256 signed webhook deliveries."},{"customer_id":"cus_RAIeval049","cancellation_reason":"The lack of a signing secret and request signature was why we canceled."},{"customer_id":"cus_RAIeval050","cancellation_reason":"We needed cryptographic verification of webhook bodies before processing events."}]
    expected_matches: >-
      [{"customer_id":"cus_RAIeval041","feature_id":"webhook-retries"},{"customer_id":"cus_RAIeval042","feature_id":"webhook-retries"},{"customer_id":"cus_RAIeval043","feature_id":"webhook-retries"},{"customer_id":"cus_RAIeval044","feature_id":"webhook-retries"},{"customer_id":"cus_RAIeval045","feature_id":"webhook-retries"},{"customer_id":"cus_RAIeval046","feature_id":"webhook-signatures"},{"customer_id":"cus_RAIeval047","feature_id":"webhook-signatures"},{"customer_id":"cus_RAIeval048","feature_id":"webhook-signatures"},{"customer_id":"cus_RAIeval049","feature_id":"webhook-signatures"},{"customer_id":"cus_RAIeval050","feature_id":"webhook-signatures"}]
    diff: |
      diff --git a/features/webhooks/deliver.ts b/features/webhooks/deliver.ts
      index 4960f88..573bd47 100644
      --- a/features/webhooks/deliver.ts
      +++ b/features/webhooks/deliver.ts
      @@ -1,8 +1,26 @@
      +import { createHmac } from "node:crypto";
      +import { jobs } from "../jobs";
      +
       export async function deliverWebhook(endpoint: Endpoint, event: Event) {
         const body = JSON.stringify(event);
      -  return fetch(endpoint.url, { method: "POST", body });
      +  const signature = createHmac("sha256", endpoint.signingSecret)
      +    .update(body)
      +    .digest("hex");
      +  const response = await fetch(endpoint.url, {
      +    method: "POST",
      +    headers: {
      +      "content-type": "application/json",
      +      "x-product-signature-256": `sha256=${signature}`,
      +    },
      +    body,
      +  });
      +  if (!response.ok && event.deliveryAttempt < 5) {
      +    await jobs.enqueue("deliver-webhook", {
      +      endpointId: endpoint.id,
      +      event: { ...event, deliveryAttempt: event.deliveryAttempt + 1 },
      +    }, { delaySeconds: 2 ** event.deliveryAttempt * 30 });
      +  }
      +  return response;
       }

