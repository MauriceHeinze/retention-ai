      +++ b/features/team/invitations.ts
      @@ -4,6 +4,12 @@ export async function inviteMember(workspace: Workspace, email: string) {
      +  const activeSeats = await members.countActive(workspace.id);
      +  if (activeSeats >= workspace.plan.seatLimit) {
      +    throw new UserFacingError("SEAT_LIMIT_REACHED", {
      +      action: "Ask a workspace owner to upgrade the plan.",
      +    });
      +  }
         return invitations.create(workspace.id, email);
       }
