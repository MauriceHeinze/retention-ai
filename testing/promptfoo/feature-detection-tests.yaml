      @@ -0,0 +1,19 @@
      +const permissions = ["projects:write", "billing:read", "members:manage"];
      +export function RoleEditor({ role, onSave }: Props) {
      +  const [name, setName] = useState(role?.name ?? "");
      +  const [selected, setSelected] = useState(role?.permissions ?? []);
      +  return <form onSubmit={() => onSave({ name, permissions: selected })}>
      +    <Input label="Role name" value={name} onChange={setName} />
      +    {permissions.map(permission => (
      +      <Checkbox
      +        key={permission}
      +        label={permission}
      +        checked={selected.includes(permission)}
      +        onChange={() => toggle(permission, selected, setSelected)}
      +      />
      +    ))}
      +    <Button type="submit">Save role</Button>
      +  </form>;
      +}
