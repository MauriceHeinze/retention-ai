- description: "1 feature: passwordless magic-link sign-in"
  vars:
    expected_features: >-
      [{"id":"magic-link-sign-in","name":"Passwordless magic-link sign-in","description":"Users can request a one-time sign-in link by email; links expire after 15 minutes and can only be used once."}]
    customers: >-
      [{"customer_id":"cus_RAIeval001","cancellation_reason":"I canceled because password-based login was too cumbersome. I wanted a secure sign-in link sent to my email."},{"customer_id":"cus_RAIeval002","cancellation_reason":"Our team needed passwordless email login and the product did not support it."},{"customer_id":"cus_RAIeval003","cancellation_reason":"I kept forgetting my password. A temporary one-time login link would have kept me subscribed."},{"customer_id":"cus_RAIeval004","cancellation_reason":"We require sign-in links that expire quickly instead of permanent passwords."},{"customer_id":"cus_RAIeval005","cancellation_reason":"Logging in on shared devices was painful. I needed a single-use link delivered by email."},{"customer_id":"cus_RAIeval006","cancellation_reason":"I left because there was no magic-link authentication option."},{"customer_id":"cus_RAIeval007","cancellation_reason":"Password resets caused too much friction for our users. We needed email-based passwordless access."},{"customer_id":"cus_RAIeval008","cancellation_reason":"I wanted to request a login link from the sign-in screen and enter the app without a password."},{"customer_id":"cus_RAIeval009","cancellation_reason":"The lack of short-lived email sign-in links was the main reason I canceled."},{"customer_id":"cus_RAIeval010","cancellation_reason":"We only adopt tools with passwordless authentication through one-time emailed links."}]
    expected_matches: >-
      [{"customer_id":"cus_RAIeval001","feature_id":"magic-link-sign-in"},{"customer_id":"cus_RAIeval002","feature_id":"magic-link-sign-in"},{"customer_id":"cus_RAIeval003","feature_id":"magic-link-sign-in"},{"customer_id":"cus_RAIeval004","feature_id":"magic-link-sign-in"},{"customer_id":"cus_RAIeval005","feature_id":"magic-link-sign-in"},{"customer_id":"cus_RAIeval006","feature_id":"magic-link-sign-in"},{"customer_id":"cus_RAIeval007","feature_id":"magic-link-sign-in"},{"customer_id":"cus_RAIeval008","feature_id":"magic-link-sign-in"},{"customer_id":"cus_RAIeval009","feature_id":"magic-link-sign-in"},{"customer_id":"cus_RAIeval010","feature_id":"magic-link-sign-in"}]
    diff: |
      diff --git a/features/auth/routes.ts b/features/auth/routes.ts
      index 6d21a19..942e8bd 100644
      --- a/features/auth/routes.ts
      +++ b/features/auth/routes.ts
      @@ -1,8 +1,24 @@
       import { Router } from "express";
      -import { verifyPassword } from "./passwords";
      +import { createMagicLink, consumeMagicLink } from "./magic-links";
       import { sendEmail } from "../email";

       export const auth = Router();
      +auth.post("/magic-link", async (req, res) => {
      +  const token = await createMagicLink({
      +    email: req.body.email,
      +    expiresInMinutes: 15,
      +    singleUse: true,
      +  });
      +  await sendEmail(req.body.email, {
      +    subject: "Your sign-in link",
      +    url: `${process.env.APP_URL}/auth/verify?token=${token}`,
      +  });
      +  res.status(202).json({ accepted: true });
      +});
      +
      +auth.get("/verify", async (req, res) => {
      +  const session = await consumeMagicLink(String(req.query.token));
      +  res.cookie("session", session.id, { httpOnly: true, sameSite: "lax" });
      +  res.redirect("/dashboard");
      +});

